name: ocr-markdown
services:
  ocr:
    build:
      context: .
      args:
        MODEL_ID: ${OCR_MODEL_ID:-iapp/OpenThai2.1-OCR-Markdown-20261118}
        MODEL_REVISION: ${OCR_MODEL_REVISION:-c974dc7d18a4511a21988f4a1d12fad07ac16625}
    ports:
      - "${OCR_BIND_ADDRESS:-127.0.0.1}:${OCR_PORT:-8090}:8090"
    environment:
      OCR_DEVICE: ${OCR_DEVICE:-cpu}
      OCR_PRELOAD: ${OCR_PRELOAD:-true}
      OCR_LOCAL_FILES_ONLY: ${OCR_LOCAL_FILES_ONLY:-false}
      OCR_MAX_FILE_MB: ${OCR_MAX_FILE_MB:-50}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-20}
      OCR_PDF_DPI: ${OCR_PDF_DPI:-200}
      OCR_MAX_NEW_TOKENS: ${OCR_MAX_NEW_TOKENS:-8744}
    volumes:
      - model-cache:/home/ocr/.cache/huggingface
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    shm_size: 1gb
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  model-cache:
